<style>
  :root{
    --bg: #F6F3EC;
    --ink: #1C2630;
    --ink-soft: #5B6470;
    --card: #FFFFFF;
    --border: #E3DDCD;
    --accent: #1F6F62;      /* verde clínico / cicatrização */
    --accent-soft: #E4EEEB;
    --accent2: #3A5E8C;     /* azul institucional, usado em chips/links secundários */
    --focus: #1F6F62;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-weight:600;
    margin:0;
  }
  a{ color:inherit; }
  :focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- header ---------- */
  header{
    padding: 28px 20px 18px;
    max-width: 1180px;
    margin: 0 auto;
    display:flex;
    gap:16px;
    align-items:center;
  }
  header img{
    width:52px; height:52px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
  }
  header .title-block h1{
    font-size: clamp(1.3rem, 2.4vw, 1.7rem);
    letter-spacing: -0.01em;
  }
  header .title-block p{
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }

  /* ---------- controls (sticky) ---------- */
  .controls{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px 16px;
  }
  .controls-inner{
    max-width: 1180px;
    margin: 0 auto;
  }
  .search-row{
    display:flex;
    gap:10px;
    margin-bottom: 12px;
  }
  .search-row input[type="search"]{
    flex:1;
    font-size: 0.98rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
  }
  .search-row input[type="search"]::placeholder{ color:#9A9488; }

  .tag-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tag-btn{
    font-family: inherit;
    font-size: 0.85rem;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink-soft);
    cursor:pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .tag-btn:hover{ border-color: var(--accent); }
  .tag-btn[aria-pressed="true"]{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .count-row{
    max-width: 1180px;
    margin: 10px auto 0;
    padding: 0 20px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  /* ---------- grid ---------- */
  main{
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 20px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent-card, var(--accent));
    border-radius: 10px;
    padding: 16px 18px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .card h2{
    font-size: 1.05rem;
    line-height:1.3;
  }
  .card .summary{
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin:0;
    flex-grow:1;
  }
  .card .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .card .tags span{
    font-size: 0.72rem;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .card .links{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top: 4px;
  }
  .card .links a{
    font-size: 0.85rem;
    text-decoration:none;
    font-weight:600;
    color: var(--accent2);
    border: 1px solid var(--accent2);
    padding: 7px 12px;
    border-radius: 7px;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .card .links a:hover{
    background: var(--accent2);
    color: #fff;
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state button{
    margin-top: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 7px;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    cursor:pointer;
  }

  footer{
    text-align:center;
    padding: 24px 20px 40px;
    color: var(--ink-soft);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <a href="https://petg10ufpel.github.io/petg10/index.html" style="display:block;flex-shrink:0;line-height:0;">
    <img src="https://petg10ufpel.github.io/petg10/img/logo2.jpeg" alt="Logo PET-Saúde UFPel G10">
  </a>
  <div class="title-block">
    <h1>PET-Saúde UFPel — Central de Infográficos</h1>
    <p>G10 · Telemonitoramento de Feridas Crônicas</p>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="search-row">
      <label for="searchInput" class="sr-only" style="position:absolute;left:-9999px;">Buscar infográficos</label>
      <input type="search" id="searchInput" placeholder="Buscar por título ou assunto…" autocomplete="off">
    </div>
    <div class="tag-row" id="tagRow" role="group" aria-label="Filtrar por categoria"></div>
  </div>
</div>

<div class="count-row" id="countRow"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <p>Nenhum infográfico encontrado com esses termos.</p>
    <button id="clearFiltersBtn">Limpar busca e filtros</button>
  </div>
</main>

<footer>
  PET-Saúde Informação e Saúde Digital · G10 — Amor à Pele · UFPel
</footer>

<script>
/* =========================================================================
   COMO ADICIONAR UM NOVO INFOGRÁFICO
   -------------------------------------------------------------------------
   Copie o bloco abaixo, cole no final do array INFOGRAFICOS (antes do ]),
   preencha os campos e salve. Nada mais no código precisa mudar: os
   botões de filtro são gerados automaticamente a partir das tags usadas
   em todos os itens — se você usar uma tag nova, ela vira um filtro novo
   sozinha.

   {
     title: "Título curto do infográfico",
     summary: "Uma frase (até ~160 caracteres) resumindo o conteúdo.",
     tags: ["Feridas Crônicas"],            // 1 a 3 tags, da lista existente
                                             // ou uma tag nova (vira filtro novo)
     links: [
       { label: "Abrir infográfico", url: "https://..." }
       // pode ter mais de um link, ex. duas versões de um simulador
     ]
   },

   Tags em uso atualmente (reaproveite quando fizer sentido, para não
   fragmentar os filtros):
   Feridas Crônicas · IA & Saúde · Ciência & Tecnologia ·
   Humanidades & Reflexão · Casos Clínicos · Guias & Estudo ·
   Saúde Pública & Ambiental · Ferramentas Interativas
   ========================================================================= */

    tags: ["Feridas Crônicas", "Guias & Estudo"],
    links: [{ label: "Abrir infográfico", url: "https://petg10ufpel.github.io/petg10/html/info/livroferidas/guia_feridas.html" }]

  {
    title: "O Olho como Janela Sistêmica",

/* =========================================================================
   Daqui pra baixo é só motor de renderização/filtro — não precisa mexer.
   ========================================================================= */

const TAG_COLORS = {
  "Feridas Crônicas": "#1F6F62",
  "IA & Saúde": "#3A5E8C",
  "Ciência & Tecnologia": "#8A6A2F",
  "Humanidades & Reflexão": "#7A4B6E",
  "Casos Clínicos": "#B4542C",
  "Guias & Estudo": "#2D6E8E",
  "Saúde Pública & Ambiental": "#4C7A3A",
  "Ferramentas Interativas": "#6A5A8C"
};
function colorForTags(tags){
  return TAG_COLORS[tags[0]] || "#1F6F62";
}

const grid = document.getElementById('grid');
const tagRow = document.getElementById('tagRow');
const searchInput = document.getElementById('searchInput');
const countRow = document.getElementById('countRow');
const emptyState = document.getElementById('emptyState');
const clearFiltersBtn = document.getElementById('clearFiltersBtn');

let activeTags = new Set();

// build tag filter chips dynamically from whatever tags exist in the data
const allTags = [...new Set(INFOGRAFICOS.flatMap(i => i.tags))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

function buildTagRow(){
  tagRow.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn';
  allBtn.textContent = 'Todos';
  allBtn.setAttribute('aria-pressed', activeTags.size === 0 ? 'true' : 'false');
  allBtn.addEventListener('click', () => {
    activeTags.clear();
    render();
  });
  tagRow.appendChild(allBtn);

  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.textContent = tag;
    btn.setAttribute('aria-pressed', activeTags.has(tag) ? 'true' : 'false');
    btn.addEventListener('click', () => {
      if (activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      render();
    });
    tagRow.appendChild(btn);
  });
}

function matchesSearch(item, term){
  if (!term) return true;
  const haystack = (item.title + ' ' + item.summary + ' ' + item.tags.join(' ')).toLowerCase();
  return haystack.includes(term);
}

function matchesTags(item){
  if (activeTags.size === 0) return true;
  return item.tags.some(t => activeTags.has(t));
}

function cardHTML(item){
  const tagsHTML = item.tags.map(t => `<span>${t}</span>`).join('');
  const linksHTML = item.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
  return `
    <article class="card" style="--accent-card:${colorForTags(item.tags)}">
      <h2>${item.title}</h2>
      <p class="summary">${item.summary}</p>
      <div class="tags">${tagsHTML}</div>
      <div class="links">${linksHTML}</div>
    </article>
  `;
}

function render(){
  buildTagRow();
  const term = searchInput.value.trim().toLowerCase();
  const results = INFOGRAFICOS.filter(item => matchesSearch(item, term) && matchesTags(item));

  grid.innerHTML = results.map(cardHTML).join('');
  countRow.textContent = `Mostrando ${results.length} de ${INFOGRAFICOS.length} infográficos`;

  const noResults = results.length === 0;
  grid.style.display = noResults ? 'none' : 'grid';
  emptyState.style.display = noResults ? 'block' : 'none';
}

searchInput.addEventListener('input', render);
clearFiltersBtn.addEventListener('click', () => {
  searchInput.value = '';
  activeTags.clear();
  render();
});

render();
</script>
