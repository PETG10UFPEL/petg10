  }
  header .title-block p{
    margin: 4px 0 0;
    color: var(--ink-soft);

  }

  .controls{
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px 16px;
  }
  .controls-inner{
    max-width: 1180px;
    margin: 0 auto;
  }
  .search-row{

    gap:10px;
    margin-bottom: 12px;
  }

    flex:1;
    font-size: 0.98rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);

    flex-wrap:wrap;
    gap:8px;

    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink-soft);

  .tag-btn[aria-pressed="true"]{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

    max-width: 1180px;
    margin: 10px auto 0;
    padding: 0 20px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 20px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent-card, var(--accent));

    padding: 16px 18px;
    display:flex;
    flex-direction:column;
    gap: 10px;

    gap:6px;

    padding: 3px 9px;

    background: var(--accent-soft);
    color: var(--accent);

    gap:8px;
    margin-top: 4px;

/* =========================================================================
   Daqui pra baixo é só motor de renderização/filtro — não precisa mexer.
   ========================================================================= */

const TAG_COLORS = {
  "Feridas Crônicas": "#1F6F62",
  "IA & Saúde": "#3A5E8C",
  "Ciência & Tecnologia": "#8A6A2F",
  "Humanidades & Reflexão": "#7A4B6E",
  "Casos Clínicos": "#B4542C",
  "Guias & Estudo": "#2D6E8E",
  "Saúde Pública & Ambiental": "#4C7A3A",
  "Ferramentas Interativas": "#6A5A8C"
};
function colorForTags(tags){
  return TAG_COLORS[tags[0]] || "#1F6F62";
}

const grid = document.getElementById('grid');
const tagRow = document.getElementById('tagRow');
const searchInput = document.getElementById('searchInput');
const countRow = document.getElementById('countRow');
const emptyState = document.getElementById('emptyState');
const clearFiltersBtn = document.getElementById('clearFiltersBtn');

let activeTags = new Set();

// build tag filter chips dynamically from whatever tags exist in the data
const allTags = [...new Set(INFOGRAFICOS.flatMap(i => i.tags))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

function buildTagRow(){
  tagRow.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tag-btn';
  allBtn.textContent = 'Todos';
  allBtn.setAttribute('aria-pressed', activeTags.size === 0 ? 'true' : 'false');
  allBtn.addEventListener('click', () => {
    activeTags.clear();
    render();
  });
  tagRow.appendChild(allBtn);

  allTags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.textContent = tag;
    btn.setAttribute('aria-pressed', activeTags.has(tag) ? 'true' : 'false');
    btn.addEventListener('click', () => {
      if (activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      render();
    });
    tagRow.appendChild(btn);
  });
}

function matchesSearch(item, term){
  if (!term) return true;
  const haystack = (item.title + ' ' + item.summary + ' ' + item.tags.join(' ')).toLowerCase();
  return haystack.includes(term);
}

function matchesTags(item){
  if (activeTags.size === 0) return true;
  return item.tags.some(t => activeTags.has(t));
}

function cardHTML(item){
  const tagsHTML = item.tags.map(t => `<span>${t}</span>`).join('');
  const linksHTML = item.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
  return `
    <article class="card" style="--accent-card:${colorForTags(item.tags)}">
      <h2>${item.title}</h2>
      <p class="summary">${item.summary}</p>
      <div class="tags">${tagsHTML}</div>
      <div class="links">${linksHTML}</div>
    </article>
  `;
}

function render(){
  buildTagRow();
  const term = searchInput.value.trim().toLowerCase();
  const results = INFOGRAFICOS.filter(item => matchesSearch(item, term) && matchesTags(item));

  grid.innerHTML = results.map(cardHTML).join('');
  countRow.textContent = `Mostrando ${results.length} de ${INFOGRAFICOS.length} infográficos`;

  const noResults = results.length === 0;
  grid.style.display = noResults ? 'none' : 'grid';
  emptyState.style.display = noResults ? 'block' : 'none';
}

searchInput.addEventListener('input', render);
clearFiltersBtn.addEventListener('click', () => {
  searchInput.value = '';
  activeTags.clear();
  render();
});

render();
</script>
