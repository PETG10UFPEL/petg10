<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruas de Lazer UFPel — Sistema de Contagem</title>
  <style>
    :root {
      --azul: #0b459b;
      --azul2: #2458e6;
      --verde: #1f9d55;
      --fundo: #10264a;
      --texto: #0d2b55;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, rgba(36,88,230,.45), transparent 32%), linear-gradient(180deg, #10264a, #0e1b2f);
      color: white;
      padding: 18px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(245,247,251,.98);
      color: var(--texto);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 18px 42px rgba(0,0,0,.32);
      text-align: center;
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      margin-bottom: 14px;
    }
    h1 {
      margin: 4px 0 6px 0;
      font-size: 24px;
      color: var(--azul);
    }
    p {
      line-height: 1.45;
      margin: 8px 0;
    }
    .muted {
      color: #5d6a82;
      font-size: 14px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--azul2), #1643c5);
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(36,88,230,.25);
    }
    .secondary {
      background: linear-gradient(135deg, var(--verde), #157a3f);
    }
    code {
      display: block;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #eef2ff;
      color: #19316f;
      font-size: 12px;
      word-break: break-all;
      text-align: left;
    }
  </style>

    <h1>Sistema de Contagem</h1>
    <p><strong>Ruas de Lazer UFPel</strong></p>
    <p class="muted">Página fixa de acesso. O botão abaixo abre a implantação atual do aplicativo.</p>

    <button onclick="abrirSistema()">Abrir sistema</button>
    <button class="secondary" onclick="recarregarPagina()">Recarregar esta página</button>

    <p class="muted" id="aviso">Redirecionamento automático em alguns segundos...</p>
    <code id="linkAtual"></code>
  </main>

  <script>
    // Troque apenas este link quando houver uma nova implantação do Apps Script.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwO5CUXwho6Y0Wg1c60kcojHcVgxD7fgu4QltLv8ObBHJ1KyEAP65jzH0Y8OveN2c3REA/exec';

    function urlComCacheBuster() {
      if (!APP_URL || APP_URL.includes('COLE_AQUI')) {
        return '';
      }
      const separador = APP_URL.includes('?') ? '&' : '?';
      return APP_URL + separador + 'v=' + Date.now();
    }

    function abrirSistema() {
      const destino = urlComCacheBuster();
      if (!destino) {
        alert('Configure a constante APP_URL no arquivo HTML antes de publicar.');
        return;
      }
      window.location.href = destino;
    }

    function recarregarPagina() {
      window.location.href = window.location.pathname + '?v=' + Date.now();
    }

    document.getElementById('linkAtual').textContent = APP_URL;

    setTimeout(() => {
      if (APP_URL && !APP_URL.includes('COLE_AQUI')) {
        abrirSistema();
      } else {
        document.getElementById('aviso').textContent = 'Configure o APP_URL antes de publicar no GitHub.';
      }
    }, 3500);
  </script>
