<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PET-Saúde UFPel | Gestão G10</title>
  <style>
    :root{
      --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #475569;
      --border: #cbd5e1; --primary: #059669; --secondary: #1e3a8a; 
      --accent: #ea580c; --shadow: 0 10px 25px rgba(0,0,0,0.05); --radius: 12px;
    }
    body{ margin:0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; touch-action: manipulation; }
    .wrap{ max-width:1200px; margin:0 auto; padding:15px; }
    
    header{
      display:flex; gap:15px; align-items:center; background:var(--card); 
      border:1px solid var(--border); border-radius:var(--radius); 
      padding:12px 20px; box-shadow:var(--shadow); margin-bottom: 15px;
    }
    header img{ width:60px; height:60px; object-fit:contain; border-radius:8px; }
    .title h1 { margin:0; font-size:1.1rem; }
    .title a { text-decoration: none; color: var(--secondary); font-weight: bold; }
    .title p { margin:2px 0 0; color:var(--muted); font-size:0.85rem; }

    .nav-buttons {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin-bottom: 10px;
    }
    @media (min-width: 768px) { .nav-buttons { grid-template-columns: repeat(4, 1fr); } }

    .btn-nav {
      background: var(--card); border: 2px solid var(--border);
      padding: 12px 5px; border-radius: 10px; cursor: pointer;
      font-weight: 600; text-align: center; display: flex; 
      flex-direction: column; align-items: center; gap: 4px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: inherit; font-size: 1rem; color: var(--text);
      width: 100%; box-sizing: border-box; appearance: none;
      -webkit-appearance: none;
    }
    .btn-nav small, .btn-nav span { pointer-events: none; }
    .btn-nav.active { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-nav.active small { color: #d1fae5; }

    .btn-app {
      display: block; text-align: center; background: var(--accent); 
      color: white; padding: 15px; border-radius: 10px; 
      text-decoration: none; font-weight: 700; margin-bottom: 15px;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
    }

    .view-container {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      height: 72vh; min-height: 500px;
      width: 100%; box-shadow: var(--shadow);
    }
    
    iframe { width: 100%; height: 100%; border: none; display: block; }
    footer{ margin-top:15px; text-align:center; font-size:0.75rem; color:var(--muted); padding-bottom: 20px; }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logos" style="display:flex; gap:10px;">
      <img src="img/logo2.jpeg" alt="Logo">
      <img src="img/petgestor.png" alt="Gestor">
    </div>
    <div class="title">
      <h1>PET-Saúde UFPel – Painel Monitores</h1>
      <h1><a href="index.html">=> Ir p/Painel Operacional</a></h1>
      <p>G10 · Telemonitoramento de Feridas Crônicas</p>
    </div>
  </header>

  <nav class="nav-buttons">
    <button class="btn-nav active" onclick="trocarAba(this,'0',true)">
      <span>📅 Registro (In)</span>
      <small>X, F, Xr, H</small>
    </button>
    <button class="btn-nav" onclick="trocarAba(this,'1992212771',false)">
      <span>📊 Presenças</span>
      <small>Relatórios</small>
    </button>
    <button class="btn-nav" onclick="trocarAba(this,'2038217552',false)">
      <span>🔄 Recuperação</span>
      <small>Reposições</small>
    </button>
    <button class="btn-nav" onclick="trocarAba(this,'564508304',false)">
      <span>📋 Organização</span>
      <small>Semestre</small>
    </button>
  </nav>

  <a href="https://docs.google.com/spreadsheets/d/1upWzo59kNPchcLO4HzQEPtldgpwK0X2KzTrI9gTsyNk/edit" class="btn-app" target="_blank">
    🚀 ABRIR NO APP GOOGLE SHEETS (Para Editar)
  </a>

  <div class="view-container" id="frameWrapper"></div>

  <footer>PET-Saúde UFPel · 2026</footer>
</div>

<script>
  const spreadsheetId = "1upWzo59kNPchcLO4HzQEPtldgpwK0X2KzTrI9gTsyNk";

  function trocarAba(btn, gid, focusMonth) {
    document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderSheet(gid, focusMonth);
  }

  function renderSheet(gid, focusMonth) {
    const wrapper = document.getElementById('frameWrapper');
    let url = "https://docs.google.com/spreadsheets/d/" + spreadsheetId + "/edit?gid=" + gid + "&rm=minimal";

    if (focusMonth) {
      const now = new Date();
      const diaUm = new Date(now.getFullYear(), now.getMonth(), 1);
      const diffDays = Math.ceil(Math.abs(diaUm - new Date(now.getFullYear(), 0, 1)) / (1000 * 60 * 60 * 24));
      url += "&range=A" + ((diffDays * 3) + 2);
    }

    wrapper.innerHTML = `<iframe src="${url}" allow="autoplay"></iframe>`;
  }

  window.onload = () => renderSheet('0', true);
</script>

</body>
</html>
