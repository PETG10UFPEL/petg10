<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G10 · Revisão de Publicações</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f4f8; --surface: #ffffff; --surface2: #f5f7fb;
  --border: #dde2ec; --border2: #c8d0e0;
  --text: #1a2236; --muted: #7a859e; --subtle: #5a6580;
  --accent: #1a6fdb; --accent-dim: #dbeafe;
  --green: #16a34a; --green-dim: #dcfce7;
  --amber: #c07000; --amber-dim: #fef3c7;
  --red: #dc2626; --red-dim: #fee2e2;
  --fase-a: #6d28d9; --fase-b: #059669; --fase-c: #b45309;
}
body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden; }

header {
  background: #ffffff; border-bottom: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  padding: 0 28px; height: 60px; display: flex; align-items: center;
  gap: 16px; position: relative; z-index: 200;
}
.logo { display: flex; align-items: baseline; gap: 8px; }
.logo-g10 { font-family: 'Lora', serif; font-weight: 600; font-size: 20px; color: var(--accent); letter-spacing: -0.5px; }
.logo-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.header-pills { display: flex; gap: 8px; margin-left: 16px; }
.pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; letter-spacing: 0.04em; }
.pill-a { background: #ede9fe; color: #6d28d9; border: 1px solid #c4b5fd; }
.pill-b { background: #d1fae5; color: #059669; border: 1px solid #6ee7b7; }
.pill-c { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
.header-stats { margin-left: auto; display: flex; gap: 24px; align-items: center; }
.hstat { text-align: right; }
.hstat-num { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; color: var(--text); line-height: 1; }
.hstat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.progress-ring-wrap { position: relative; width: 44px; height: 44px; }
.progress-ring-wrap svg { transform: rotate(-90deg); }
.progress-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; color: var(--green); }

.app-body { display: flex; height: calc(100vh - 60px); }

.sidebar { width: 400px; min-width: 360px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.filter-bar { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.search-wrap { position: relative; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
.search-wrap input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 13px; padding: 8px 10px 8px 32px; border-radius: 8px; outline: none; transition: border-color 0.2s; }
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap input:focus { border-color: var(--accent); }
.filter-row { display: flex; gap: 8px; }
select { flex: 1; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 12px; padding: 6px 8px; border-radius: 6px; outline: none; cursor: pointer; }
select:focus { border-color: var(--accent); }
select option { background: var(--surface2); }

.work-list { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
.work-item { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; position: relative; }
.work-item:hover { background: var(--surface2); }
.work-item.active { background: #dbeafe; border-left: 3px solid #1a6fdb; }
.work-item-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.code-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; background: var(--surface2); border: 1px solid var(--border2); color: var(--muted); padding: 2px 6px; border-radius: 4px; }
.fase-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.fase-dot-A { background: var(--fase-a); }
.fase-dot-B { background: var(--fase-b); }
.fase-dot-C { background: var(--fase-c); }
.work-title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
.work-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.authors-mini { display: flex; gap: 3px; flex-wrap: wrap; }
.author-chip { font-size: 10px; background: var(--surface2); border: 1px solid var(--border2); color: var(--subtle); padding: 1px 6px; border-radius: 99px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; position: absolute; top: 14px; right: 14px; flex-shrink: 0; }
.status-pending { background: #f59e0b; box-shadow: 0 0 5px rgba(245,158,11,0.5); }
.status-approved { background: #16a34a; box-shadow: 0 0 5px rgba(22,163,74,0.5); }
.status-adjust { background: #dc2626; box-shadow: 0 0 5px rgba(220,38,38,0.5); }
.empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }

.main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.panel-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--muted); }
.placeholder-icon { font-size: 48px; opacity: 0.3; }
.panel-placeholder p { font-size: 14px; }

.detail-view { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.detail-view.visible { display: flex; }

.detail-header { padding: 24px 32px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
.detail-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.detail-fase { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; letter-spacing: 0.06em; flex-shrink: 0; margin-top: 3px; }
.detail-fase-A { background: #ede9fe; color: #6d28d9; }
.detail-fase-B { background: #d1fae5; color: #059669; }
.detail-fase-C { background: #fef3c7; color: #b45309; }
.detail-title { font-family: 'Lora', serif; font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.3; }
.detail-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn-link { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: white; text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px; transition: opacity 0.15s, transform 0.1s; }
.btn-link:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-link-ghost { background: var(--surface2); color: var(--subtle); border: 1px solid var(--border2); }
.detail-authors { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.author-badge { font-size: 11px; background: var(--surface2); border: 1px solid var(--border2); color: var(--subtle); padding: 4px 10px; border-radius: 99px; display: flex; align-items: center; gap: 4px; }
.author-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.6; }

.review-area { flex: 1; overflow-y: auto; padding: 28px 32px; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
.review-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 12px; font-weight: 700; }

.status-selector { display: flex; gap: 10px; margin-bottom: 28px; }
.status-btn { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid var(--border2); background: var(--surface2); color: var(--subtle); font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 7px; }
.status-btn:hover { background: var(--surface); }
.status-btn.sel-pending { border-color: var(--amber); background: var(--amber-dim); color: var(--amber); }
.status-btn.sel-approved { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.status-btn.sel-adjust { border-color: var(--red); background: var(--red-dim); color: var(--red); }

.comment-block { margin-bottom: 28px; }
.comment-box { width: 100%; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-family: 'Nunito', sans-serif; font-size: 14px; padding: 14px 16px; border-radius: 10px; resize: vertical; min-height: 120px; outline: none; transition: border-color 0.2s; line-height: 1.6; }
.comment-box::placeholder { color: var(--muted); }
.comment-box:focus { border-color: var(--accent); }

.date-block { margin-bottom: 28px; }
.date-input { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 9px 14px; border-radius: 8px; outline: none; transition: border-color 0.2s; color-scheme: light; }
.date-input:focus { border-color: var(--accent); }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.info-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.info-card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
.info-card-value { font-size: 14px; font-weight: 600; color: var(--text); }
.info-card-value.mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }

.save-bar { padding: 16px 32px; border-top: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 12px; }
.btn-save { background: var(--accent); color: white; border: none; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; padding: 10px 28px; border-radius: 8px; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
.btn-save:hover { opacity: 0.88; transform: translateY(-1px); }
.save-status { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; }
.save-status.show { opacity: 1; }
.nav-btns { margin-left: auto; display: flex; gap: 8px; }
.btn-nav { background: var(--surface2); border: 1px solid var(--border2); color: var(--subtle); font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 7px; cursor: pointer; transition: all 0.15s; }
.btn-nav:hover { border-color: var(--accent); color: var(--accent); }
.btn-nav:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
</style>
</head>

          <div class="review-section-title">Data da Revisão</div>
          <input type="date" class="date-input" id="date-input">
        </div>

        <div class="info-grid">
          <div class="info-card">
            <div class="info-card-label">Categoria</div>
            <div class="info-card-value" id="d-obs">—</div>
          </div>
          <div class="info-card">
            <div class="info-card-label">Nº de Autores</div>
            <div class="info-card-value mono" id="d-nauthors">—</div>
          </div>
          <div class="info-card">
            <div class="info-card-label">Fase</div>
            <div class="info-card-value" id="d-fase2">—</div>
          </div>
          <div class="info-card">
            <div class="info-card-label">Código</div>
            <div class="info-card-value mono" id="d-code2">—</div>
          </div>
        </div>
      </div>

      <div class="save-bar">
        <button class="btn-save" onclick="saveReview()">Salvar Revisão</button>
        <span class="save-status" id="save-status">✓ Salvo com sucesso</span>
        <div class="nav-btns">
          <button class="btn-nav" id="btn-prev" onclick="navigate(-1)">← Anterior</button>
          <button class="btn-nav" id="btn-next" onclick="navigate(1)">Próximo →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const WORKS = [
  {id:'100',fase:'A',title:'Infográfico técnico',authors:['Danusa','Patrícia'],nAuthors:2,obs:'At. Férias',link:'https://docs.google.com/document/d/1quPN7F1fB7eKkJhoaXlTlvb48PQD-VUZhWpVxBeM83I/edit?usp=sharing'},
  {id:'101',fase:'A',title:'Mini-guia',authors:['Giovana','Patrícia'],nAuthors:2,obs:'At. Férias',link:'https://docs.google.com/document/d/19o_MuxELVLYJO7CFlAp-Y8UxBroESYJC1rFnk3lJ50w/edit?usp=sharing'},
  {id:'102',fase:'A',title:'Principais tipos de Feridas Crônicas',authors:['Leonardo'],nAuthors:1,obs:'At. Férias',link:'https://docs.google.com/document/d/1TvD9Rls_6C_9IaU2sKvvdv9OZj0AbKtyuYmHidbU01g/edit?usp=drive_link'},
  {id:'103',fase:'A',title:'Uso de tecnologias digitais e telemonitoramento em feridas crônicas: revisão da literatura',authors:['Cassiane'],nAuthors:1,obs:'At. Férias',link:'https://docs.google.com/document/d/1Wo19zxPTX_vvs6OpFgfYJ5Iu4GI8hDdzICqNXPI4KPI/edit?usp=drive_link'},
  {id:'104',fase:'A',title:'Como realizar o monitoramento de Feridas',authors:['Cassiane'],nAuthors:1,obs:'At. Férias',link:'https://docs.google.com/document/d/1YsXPZc8TSucBcnsjLCossAUwE4m12N_HmAuuPOXF41c/edit?usp=drive_link'},
  {id:'105',fase:'C',title:'Elaboração Site',authors:['Giovana','Lyah'],nAuthors:2,obs:'At. Férias',link:'https://docs.google.com/document/d/1t_UEzNvM9zIwJBeG9hr0Bp-gu3YLYUjj7j_jz5y8ioo/edit?usp=drive_link'},
  {id:'106',fase:'A',title:'Storytelling',authors:['GabrielaA','Lucas'],nAuthors:2,obs:'At. Férias',link:'https://docs.google.com/document/d/1t_UEzNvM9zIwJBeG9hr0Bp-gu3YLYUjj7j_jz5y8ioo/edit?usp=drive_link'},
  {id:'107',fase:'A',title:'Caso Clínico. Estudo de Caso',authors:['Lucas'],nAuthors:1,obs:'Geral',link:'https://docs.google.com/document/d/179-ur5XteIIWzm0EShPuJVycQR4IeuIwB-TzUrODXjo/edit?usp=drive_link'},
  {id:'108',fase:'A',title:'Cuidados básicos com feridas crônicas na atenção primária: análise de recomendações oficiais',authors:['Cassiane'],nAuthors:1,obs:'At. Férias',link:'https://docs.google.com/document/d/18gHKz0QXcFfuU_HBvca0nCEqaZzvrjrNZE32fMmfkeA/edit?usp=drive_link'},
  {id:'109',fase:'B',title:'Ensina Feridas',authors:['Danusa','Patrícia'],nAuthors:2,obs:'Sistemas',link:'https://docs.google.com/document/d/1EDZM4S0j0VzC_oP-3zUbgRVme29xeeoZYBwXbWWvCnE/edit?usp=drive_link'},
  {id:'110',fase:'B',title:'Capacita Timers',authors:['Danusa','GabrielaA','Yanka'],nAuthors:3,obs:'Sistemas',link:'https://docs.google.com/document/d/1M3Nx0tQn-ZIHZfpXamK9DF_4jZAIJxIkPsjrLLw8faE/edit?usp=drive_link'},
  {id:'111',fase:'B',title:'Sistemas Rotas',authors:['Lyah','Yanka'],nAuthors:2,obs:'Sistemas',link:'https://docs.google.com/document/d/1N07lKJq6_oJ4vwNUBnjelFiOmnsFWIHVRbZzFfHkLJU/edit?usp=drive_link'},
  {id:'112',fase:'B',title:'Embeddings Alimentos',authors:[],nAuthors:0,obs:'Sistemas',link:'https://docs.google.com/document/d/1O3-DrSAR_quNnFDUiHsHy1DsNMmoeF8qaEz0Bth3O9k/edit?usp=drive_link'},
  {id:'113',fase:'B',title:'Embeddings Feridas',authors:['Danusa','GabrielaA','Yanka'],nAuthors:3,obs:'Sistemas',link:'https://docs.google.com/document/d/1ONfGKohNc_u7xUv8zYN7I-lQGffGJEzCvzYvqfTLsio/edit?usp=drive_link'},
  {id:'114',fase:'B',title:'Embeddings Guia',authors:['Lucas','Giovana','Yanka'],nAuthors:3,obs:'Sistemas',link:'https://docs.google.com/document/d/1TqaaL4aq9dLSqg_tGT3_e5VbJ_XFdc7BH9s0bp21etM/edit?usp=drive_link'},
  {id:'115',fase:'C',title:'Guarany x Evolução',authors:['Danusa','Giovana'],nAuthors:2,obs:'Revisão',link:'https://docs.google.com/document/d/1XkZCnkQHgsn8__kOfL6SlayPSIUKTXaJqEds1E2MdsU/edit?usp=drive_link'},
  {id:'116',fase:'C',title:'Equação das Feridas',authors:['Amanda','GabrielaA','Danusa'],nAuthors:3,obs:'Revisão',link:'https://docs.google.com/document/d/1pq2bhb0m9YmpXb5FPzmbBgBn7DeIqV4XdzkaTOkGeWg/edit?usp=drive_link'},
  {id:'117',fase:'A',title:'Caso Clínico 2. Estudo de Caso',authors:['Amanda','Lucas'],nAuthors:2,obs:'Geral',link:'https://docs.google.com/document/d/1q4fugjdgexEw7YAbuM5tQo5JnjWQsX14TXvI1ceKa1c/edit?usp=drive_link'},
  {id:'118',fase:'C',title:'Página E-projetos G10',authors:[],nAuthors:0,obs:'Sistemas',link:'https://docs.google.com/document/d/1roOqzYxkBo1ldRvJ8t5R8ejLoVsnQxg9w75WahlgyQ0/edit?usp=drive_link'},
  {id:'119',fase:'B',title:'Organização G10',authors:['Amanda','Giovana','Fernando'],nAuthors:3,obs:'Geral',link:'https://docs.google.com/document/d/1vlHlHxZOo_PI_rUaKFyexbq8BS2iMTAR8Zcm1Fj4Qeg/edit?usp=drive_link'},
  {id:'120',fase:'B',title:'Gestão de estoques e entregas de material (feridas)',authors:['Danusa','GabrielaA','Giovana','Fernando'],nAuthors:4,obs:'Especialidades',link:'https://docs.google.com/document/d/1yhrAV66Tjm1JMYt38mXI5shtCoSxyrLg7snts6E1CIs/edit?usp=drive_link'},
  {id:'121',fase:'B',title:'Organização e Relato das VDs',authors:['Amanda','Lucas','Yanka'],nAuthors:3,obs:'Geral',link:'https://docs.google.com/document/d/149--6JxoxcpPGM6HSHjyA0DT0hj82IjWWSemIgHXqJQ/edit?usp=drive_link'},
  {id:'122',fase:'A',title:'Elaboração do Protocolo Sistemas de Telemonitoramento',authors:['GabrielaA','Fernando','Leonardo','Yanka'],nAuthors:4,obs:'At. Recesso',link:'https://docs.google.com/document/d/197I0FN5ifJscBPkxVq8iBxoOLOrG6TRhqi2R9oa8bQk/edit?usp=drive_link'},
  {id:'123',fase:'A',title:'Elaboração dos Requisitos Sistemas de Telemonitoramento',authors:['Amanda','Cassiane','Lucas'],nAuthors:3,obs:'At. Recesso',link:'https://docs.google.com/document/d/1CluW0e1k2Ae27NzcCq7ZVNlCFZbHKUB02dW4UYitdms/edit?usp=drive_link'},
  {id:'124',fase:'A',title:'Elaboração dos Fluxogramas Sistemas de Telemonitoramento',authors:['Fernando','Lucas'],nAuthors:2,obs:'At. Recesso',link:'https://docs.google.com/document/d/1RIpiv4Cnmyb5Le6r5PTYZALb9ANs5-0yH1bA8rym-jM/edit?usp=drive_link'},
  {id:'125',fase:'A',title:'Elaboração de Atividades Lúdicas Ruas de Lazer',authors:['Danusa','Patrícia'],nAuthors:2,obs:'At. Recesso',link:'https://docs.google.com/document/d/1etNkAaxKOSO9QcKJeW2eXj9zcH8QXpAFvfaiHDCYJf4/edit?usp=drive_link'},
  {id:'126',fase:'A',title:'Participação de G10 no Ruas de Lazer',authors:['Giovana','Leonardo','Fernando'],nAuthors:3,obs:'Geral',link:'https://docs.google.com/document/d/1hyEYkhqujuo1j7UxFeEvvT-BCuFkegKatGirBugRZKE/edit?usp=drive_link'},
  {id:'127',fase:'B',title:'JONAH embeddings',authors:['Danusa','GabrielaA','Giovana'],nAuthors:3,obs:'Sistemas',link:'https://docs.google.com/document/d/16IsZOf2MuwBzj3--UVcqcr7MLfh-BB_yQqHq1l1ExrE/edit?usp=drive_link'},
];

let reviews = JSON.parse(localStorage.getItem('g10-reviews') || '{}');
let activeId = null;
let filteredWorks = [...WORKS];
let currentStatus = 'pending';

function renderList() {
  const list = document.getElementById('work-list');
  const search = document.getElementById('search-input').value.toLowerCase();
  const filterFase = document.getElementById('filter-fase').value;
  const filterStatus = document.getElementById('filter-status').value;
  const filterObs = document.getElementById('filter-obs').value;

  filteredWorks = WORKS.filter(w => {
    const r = reviews[w.id] || {};
    const st = r.status || 'pending';
    return (!search || w.title.toLowerCase().includes(search) || w.authors.some(a => a.toLowerCase().includes(search)))
        && (!filterFase || w.fase === filterFase)
        && (!filterStatus || st === filterStatus)
        && (!filterObs || w.obs === filterObs);
  });

  if (!filteredWorks.length) {
    list.innerHTML = '<div class="empty-state">Nenhum trabalho encontrado.</div>';
    return;
  }

  list.innerHTML = filteredWorks.map((w, i) => {
    const r = reviews[w.id] || {};
    const st = r.status || 'pending';
    const dotClass = {pending:'status-pending', approved:'status-approved', adjust:'status-adjust'}[st];
    return `
    <div class="work-item${w.id===activeId?' active':''}" onclick="selectWork('${w.id}')" style="animation:fadeIn 0.18s ${i*0.025}s both">
      <div class="status-dot ${dotClass}"></div>
      <div class="work-item-top">
        <span class="code-tag">#${w.id}</span>
        <span class="fase-dot fase-dot-${w.fase}"></span>
        <span style="font-size:10px;color:var(--muted)">${w.obs}</span>
      </div>
      <div class="work-title">${w.title}</div>
      <div class="work-meta">
        <div class="authors-mini">
          ${w.authors.length ? w.authors.slice(0,5).map(a=>`<span class="author-chip">${a}</span>`).join('')+(w.authors.length>5?`<span class="author-chip">+${w.authors.length-5}</span>`:'') : '<span style="font-size:10px;color:var(--muted);font-style:italic">Sem autores</span>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

function selectWork(id) {
  activeId = id;
  const w = WORKS.find(x => x.id === id);
  const r = reviews[id] || {};

  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('detail-view').classList.add('visible');

  const faseEl = document.getElementById('d-fase');
  faseEl.textContent = `Fase ${w.fase}`;
  faseEl.className = `detail-fase detail-fase-${w.fase}`;
  document.getElementById('d-title').textContent = w.title;
  document.getElementById('d-link').href = w.link;
  document.getElementById('d-code-badge').textContent = `#${w.id}`;
  document.getElementById('d-authors').innerHTML = w.authors.map(a=>`<span class="author-badge">${a}</span>`).join('');
  document.getElementById('d-obs').textContent = w.obs;
  document.getElementById('d-nauthors').textContent = w.nAuthors + (w.nAuthors===1?' autor':' autores');
  document.getElementById('d-fase2').textContent = `Fase ${w.fase}`;
  document.getElementById('d-code2').textContent = `#${w.id}`;

  setStatus(r.status || 'pending');
  document.getElementById('comment-box').value = r.comment || '';
  document.getElementById('date-input').value = r.date || new Date().toISOString().split('T')[0];

  const idx = filteredWorks.findIndex(x => x.id === id);
  document.getElementById('btn-prev').disabled = idx <= 0;
  document.getElementById('btn-next').disabled = idx >= filteredWorks.length - 1;

  renderList();
}

function setStatus(st) {
  currentStatus = st;
  ['pending','approved','adjust'].forEach(s => {
    document.getElementById(`btn-${s}`).className = 'status-btn' + (s===st ? ` sel-${s}` : '');
  });
}

function saveReview() {
  if (!activeId) return;
  reviews[activeId] = {
    status: currentStatus,
    comment: document.getElementById('comment-box').value,
    date: document.getElementById('date-input').value,
    savedAt: new Date().toISOString()
  };
  localStorage.setItem('g10-reviews', JSON.stringify(reviews));
  const s = document.getElementById('save-status');
  s.classList.add('show');
  setTimeout(() => s.classList.remove('show'), 2500);
  updateStats();
  renderList();
}

function navigate(dir) {
  const idx = filteredWorks.findIndex(x => x.id === activeId);
  const next = filteredWorks[idx + dir];
  if (next) selectWork(next.id);
}

function updateStats() {
  const total = WORKS.length;
  const done = WORKS.filter(w => { const r = reviews[w.id]; return r && r.status !== 'pending'; }).length;
  const pending = total - done;
  const pct = Math.round((done / total) * 100);
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('ring-pct').textContent = pct + '%';
  const circ = 2 * Math.PI * 18;
  document.getElementById('ring-fill').style.strokeDashoffset = circ - (pct/100)*circ;
}

document.getElementById('search-input').addEventListener('input', renderList);
document.getElementById('filter-fase').addEventListener('change', renderList);
document.getElementById('filter-status').addEventListener('change', renderList);
document.getElementById('filter-obs').addEventListener('change', renderList);

// keydown nav
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowUp') navigate(-1);
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveReview(); }
});

// fade animation
const style = document.createElement('style');
style.textContent = '@keyframes fadeIn { from { opacity:0; transform:translateY(5px) } to { opacity:1; transform:translateY(0) } }';
document.head.appendChild(style);

updateStats();
renderList();
</script>
</body>
</html>
