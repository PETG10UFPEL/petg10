<svg viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="500" height="280" fill="#F8FAFC" rx="12"/>
  <text x="250" y="24" font-size="12" font-weight="700" fill="#1B4E6B" text-anchor="middle">Recorrência de úlcera venosa em 10 anos</text>
  <text x="250" y="40" font-size="9.5" fill="#64748B" text-anchor="middle">Estudo Milic et al. (2023), n=477 pacientes, seguimento de 10 anos</text>

  <!-- Y-axis -->
  <line x1="65" y1="55" x2="65" y2="225" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- X-axis -->
  <line x1="65" y1="225" x2="460" y2="225" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Y gridlines and labels -->
  <line x1="65" y1="225" x2="460" y2="225" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="58" y="228" font-size="9" fill="#94A3B8" text-anchor="end">0%</text>
  <line x1="65" y1="183" x2="460" y2="183" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="58" y="186" font-size="9" fill="#94A3B8" text-anchor="end">25%</text>
  <line x1="65" y1="140" x2="460" y2="140" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="58" y="143" font-size="9" fill="#94A3B8" text-anchor="end">50%</text>
  <line x1="65" y1="98" x2="460" y2="98" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="58" y="101" font-size="9" fill="#94A3B8" text-anchor="end">75%</text>
  <line x1="65" y1="57" x2="460" y2="57" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="58" y="60" font-size="9" fill="#94A3B8" text-anchor="end">100%</text>

  <!-- Bar 1: 18-25 mmHg = 96% recurrence -->
  <rect x="100" y="62" width="90" height="163" rx="6" fill="#EF4444" opacity="0.85"/>
  <text x="145" y="58" font-size="14" font-weight="800" fill="#DC2626" text-anchor="middle">96%</text>
  <text x="145" y="243" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">18–25 mmHg</text>
  <text x="145" y="256" font-size="8.5" fill="#64748B" text-anchor="middle">Classe 1 BSI</text>
  <text x="145" y="267" font-size="8" fill="#94A3B8" text-anchor="middle">(compressão leve)</text>

  <!-- Bar 2: 25-35 mmHg = 66.9% recurrence -->
  <rect x="235" y="112" width="90" height="113" rx="6" fill="#F59E0B" opacity="0.85"/>
  <text x="280" y="108" font-size="14" font-weight="800" fill="#D97706" text-anchor="middle">66,9%</text>
  <text x="280" y="243" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">25–35 mmHg</text>
  <text x="280" y="256" font-size="8.5" fill="#64748B" text-anchor="middle">Classe 2 BSI</text>
  <text x="280" y="267" font-size="8" fill="#94A3B8" text-anchor="middle">(compressão moderada)</text>

  <!-- Bar 3: 35-50 mmHg = 24.5% recurrence -->
  <rect x="370" y="183" width="90" height="42" rx="6" fill="#22C55E" opacity="0.85"/>
  <text x="415" y="179" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">24,5%</text>
  <text x="415" y="243" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">35–50 mmHg</text>
  <text x="415" y="256" font-size="8.5" fill="#64748B" text-anchor="middle">Multicamadas</text>
  <text x="415" y="267" font-size="8" fill="#94A3B8" text-anchor="middle">(compressão forte)</text>

  <!-- Insight callout -->
  <rect x="78" y="55" width="345" height="1" fill="none"/>
</svg>
