<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">

  <!-- Background -->
  <rect width="700" height="340" fill="#ffffff"/>

  <!-- ── HEADER ── -->
  <text x="350" y="38" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5">John Bell &amp; Croyden</text>
  <!-- ampersand decorative already in text above -->

  <!-- EST 1798 with red underline -->
  <text x="350" y="60" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="3" font-family="'Arial', sans-serif">EST 1798</text>
  <line x1="305" y1="64" x2="395" y2="64" stroke="#CC0000" stroke-width="2.5"/>

  <!-- ── SIZE GUIDE label ── -->
  <rect x="0" y="78" width="700" height="1" fill="#e0e0e0"/>
  <text x="20" y="100" font-size="13" font-weight="700" fill="#2a2a2a" font-family="Arial, sans-serif" letter-spacing="0.3">SIZE GUIDE</text>
  <rect x="0" y="106" width="700" height="1" fill="#e0e0e0"/>

  <!-- ── LEG ILLUSTRATION (simplified schematic) ── -->
  <!-- Leg outline -->
  <g transform="translate(18, 115)">
    <!-- Boot/shoe -->
    <ellipse cx="28" cy="195" rx="22" ry="8" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
    <!-- Lower leg -->
    <path d="M14,185 Q10,150 12,110 Q14,85 20,70 Q24,58 28,52 Q32,58 36,70 Q42,85 44,110 Q46,150 42,185 Z" fill="#c8c8c8" stroke="#888" stroke-width="1"/>
    <!-- Knee -->
    <ellipse cx="28" cy="100" rx="18" ry="14" fill="#b8b8b8" stroke="#888" stroke-width="1"/>
    <!-- Upper leg / thigh -->
    <path d="M16,92 Q12,70 14,45 Q16,28 22,18 Q25,12 28,10 Q31,12 34,18 Q40,28 42,45 Q44,70 40,92 Z" fill="#c8c8c8" stroke="#888" stroke-width="1"/>
    <!-- Stocking top band -->
    <rect x="13" y="8" width="30" height="6" rx="3" fill="#888"/>

    <!-- Measurement dots and labels -->
    <!-- A - Hip area (top) -->
    <circle cx="6" cy="11" r="7" fill="#2ecc71" stroke="white" stroke-width="1.5"/>
    <text x="6" y="15" font-size="9" font-weight="700" fill="white" text-anchor="middle" font-family="Arial">A</text>
    <line x1="13" y1="11" x2="28" y2="11" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- B - Thigh/calf (mid) -->
    <circle cx="6" cy="75" r="7" fill="#2ecc71" stroke="white" stroke-width="1.5"/>
    <text x="6" y="79" font-size="9" font-weight="700" fill="white" text-anchor="middle" font-family="Arial">B</text>
    <line x1="13" y1="75" x2="28" y2="75" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- C - Ankle -->
    <circle cx="6" cy="148" r="7" fill="#2ecc71" stroke="white" stroke-width="1.5"/>
    <text x="6" y="152" font-size="9" font-weight="700" fill="white" text-anchor="middle" font-family="Arial">C</text>
    <line x1="13" y1="148" x2="28" y2="148" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- D - Foot -->
    <circle cx="6" cy="188" r="7" fill="#2ecc71" stroke="white" stroke-width="1.5"/>
    <text x="6" y="192" font-size="9" font-weight="700" fill="white" text-anchor="middle" font-family="Arial">D</text>
    <line x1="13" y1="188" x2="28" y2="188" stroke="#2ecc71" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Hip label -->
    <text x="28" y="6" font-size="8" fill="#555" text-anchor="middle" font-family="Arial">Hip</text>

    <!-- Red arrow pointing to B -->
    <polygon points="52,72 65,68 65,78" fill="#CC0000"/>
    <line x1="52" y1="75" x2="45" y2="75" stroke="#CC0000" stroke-width="2"/>
  </g>

  <!-- ── TABLE ── -->
  <g font-family="Arial, sans-serif" font-size="11">

    <!-- Column positions: Size=90, S=185, M=280, L=375, XL=470, XXL=570 -->
    <!-- Header row -->
    <rect x="82" y="115" width="600" height="26" fill="#f5f5f5"/>
    <text x="108" y="132" font-size="11" font-weight="700" fill="#1a1a1a">Size</text>
    <text x="200" y="132" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">S</text>
    <text x="295" y="132" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">M</text>
    <text x="390" y="132" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">L</text>
    <text x="490" y="132" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">XL</text>
    <text x="590" y="132" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">XXL</text>

    <!-- Row dividers -->
    <line x1="82" y1="141" x2="682" y2="141" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="82" y1="167" x2="682" y2="167" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="82" y1="193" x2="682" y2="193" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="82" y1="219" x2="682" y2="219" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="82" y1="245" x2="682" y2="245" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="82" y1="115" x2="682" y2="115" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="82" y1="115" x2="82"  y2="313" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="682" y1="115" x2="682" y2="313" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="82" y1="313" x2="682" y2="313" stroke="#e0e0e0" stroke-width="1"/>
    <!-- vertical col dividers -->
    <line x1="155" y1="115" x2="155" y2="313" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="250" y1="115" x2="250" y2="313" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="345" y1="115" x2="345" y2="313" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="440" y1="115" x2="440" y2="313" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="540" y1="115" x2="540" y2="313" stroke="#e0e0e0" stroke-width="1"/>

    <!-- ROW: Hip -->
    <rect x="82" y="141" width="600" height="26" fill="#fafafa"/>
    <text x="108" y="158" font-size="11" fill="#1a1a1a">Hip</text>
    <text x="200" y="158" font-size="10.5" fill="#333" text-anchor="middle">Up to 107cm</text>
    <text x="295" y="158" font-size="10.5" fill="#333" text-anchor="middle">107–112cm</text>
    <text x="390" y="158" font-size="10.5" fill="#333" text-anchor="middle">112–122cm</text>
    <text x="490" y="158" font-size="10.5" fill="#333" text-anchor="middle">122–132cm</text>
    <text x="590" y="158" font-size="10.5" fill="#888" text-anchor="middle">N/A</text>

    <!-- ROW: A -->
    <rect x="82" y="167" width="600" height="26" fill="#fff"/>
    <text x="108" y="184" font-size="11" fill="#1a1a1a">A</text>
    <text x="200" y="184" font-size="10.5" fill="#333" text-anchor="middle">40.5–53.0cm</text>
    <text x="295" y="184" font-size="10.5" fill="#333" text-anchor="middle">43.0–55.0cm</text>
    <text x="390" y="184" font-size="10.5" fill="#333" text-anchor="middle">48.0–60.5cm</text>
    <text x="490" y="184" font-size="10.5" fill="#333" text-anchor="middle">53.0–66.0cm</text>
    <text x="590" y="184" font-size="10.5" fill="#888" text-anchor="middle">N/A</text>

    <!-- ROW: B — highlighted (red arrow points here) -->
    <rect x="82" y="193" width="600" height="26" fill="#fff8f8"/>
    <text x="108" y="210" font-size="11" fill="#1a1a1a">B</text>
    <text x="200" y="210" font-size="10.5" fill="#333" text-anchor="middle">30.5–37.5cm</text>
    <text x="295" y="210" font-size="10.5" fill="#333" text-anchor="middle">33.0–40.0cm</text>
    <text x="390" y="210" font-size="10.5" fill="#333" text-anchor="middle">35.5–43.0cm</text>
    <text x="490" y="210" font-size="10.5" fill="#333" text-anchor="middle">38.0–46.0cm</text>
    <text x="590" y="210" font-size="10.5" fill="#333" text-anchor="middle">40.0–49.0cm</text>

    <!-- ROW: C -->
    <rect x="82" y="219" width="600" height="26" fill="#fff"/>
    <text x="108" y="236" font-size="11" fill="#1a1a1a">C</text>
    <text x="200" y="236" font-size="10.5" fill="#333" text-anchor="middle">19.5–25.5cm</text>
    <text x="295" y="236" font-size="10.5" fill="#333" text-anchor="middle">21.5–27.5cm</text>
    <text x="390" y="236" font-size="10.5" fill="#333" text-anchor="middle">22.5–29.5cm</text>
    <text x="490" y="236" font-size="10.5" fill="#333" text-anchor="middle">23.0–32.0cm</text>
    <text x="590" y="236" font-size="10.5" fill="#333" text-anchor="middle">23.5–34.0cm</text>

    <!-- ROW: D -->
    <rect x="82" y="245" width="600" height="26" fill="#fafafa"/>
    <text x="108" y="262" font-size="11" fill="#1a1a1a">D</text>
    <text x="200" y="262" font-size="10.5" fill="#333" text-anchor="middle">20.5–24.0cm</text>
    <text x="295" y="262" font-size="10.5" fill="#333" text-anchor="middle">23.0–26.0cm</text>
    <text x="390" y="262" font-size="10.5" fill="#333" text-anchor="middle">25.5–29.5cm</text>
    <text x="490" y="262" font-size="10.5" fill="#333" text-anchor="middle">26.5–32.5cm</text>
    <text x="590" y="262" font-size="10.5" fill="#333" text-anchor="middle">26.5–32.5cm</text>

    <!-- Empty rows to fill bottom of table -->
    <rect x="82" y="271" width="600" height="21" fill="#fff"/>
    <rect x="82" y="292" width="600" height="21" fill="#fafafa"/>

  </g>

  <!-- ── CAPTION / SOURCE ── -->
  <text x="350" y="327" font-size="8.5" fill="#888" text-anchor="middle" font-family="Arial, sans-serif">
    Fonte: johnbellcroyden.co.uk · Est. 1798, Wigmore Street, Londres
  </text>

</svg>
