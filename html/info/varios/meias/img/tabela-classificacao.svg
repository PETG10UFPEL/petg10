<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="620" height="300" fill="#FAFAFA" rx="12"/>

  <!-- Title -->
  <text x="310" y="26" font-size="13" font-weight="700" fill="#1B4E6B" text-anchor="middle">Por que os valores em mmHg diferem? As classificações não são iguais</text>

  <!-- Column headers -->
  <rect x="10" y="38" width="600" height="30" rx="6" fill="#1B4E6B"/>
  <text x="80" y="58" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CLASSE</text>
  <text x="210" y="58" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PADRÃO BRITÂNICO (BSI)</text>
  <text x="380" y="58" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">PADRÃO EUROPEU / RAL-GZ 387</text>
  <text x="555" y="58" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">USO TÍPICO</text>

  <!-- Row 1 -->
  <rect x="10" y="68" width="600" height="48" rx="0" fill="#EFF6FF"/>
  <text x="80" y="89" font-size="13" font-weight="800" fill="#1B4E6B" text-anchor="middle">Classe 1</text>
  <text x="80" y="105" font-size="9" fill="#64748B" text-anchor="middle">Leve</text>
  <rect x="148" y="74" width="125" height="36" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="210" y="92" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">14–17 mmHg</text>
  <text x="210" y="106" font-size="8.5" fill="#1E40AF" text-anchor="middle">BSI 6612</text>
  <rect x="318" y="74" width="125" height="36" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="380" y="92" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">18–21 mmHg</text>
  <text x="380" y="106" font-size="8.5" fill="#166534" text-anchor="middle">RAL-GZ 387</text>
  <text x="555" y="93" font-size="9" fill="#334155" text-anchor="middle">Varizes leves,</text>
  <text x="555" y="105" font-size="9" fill="#334155" text-anchor="middle">prevenção</text>

  <!-- Row 2 -->
  <rect x="10" y="116" width="600" height="48" rx="0" fill="#FFFFFF"/>
  <text x="80" y="137" font-size="13" font-weight="800" fill="#1B4E6B" text-anchor="middle">Classe 2</text>
  <text x="80" y="153" font-size="9" fill="#64748B" text-anchor="middle">Moderada</text>
  <rect x="148" y="122" width="125" height="36" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="210" y="140" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">18–24 mmHg</text>
  <text x="210" y="154" font-size="8.5" fill="#1E40AF" text-anchor="middle">BSI 6612</text>
  <rect x="318" y="122" width="125" height="36" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="380" y="140" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">23–32 mmHg</text>
  <text x="380" y="154" font-size="8.5" fill="#166534" text-anchor="middle">RAL-GZ 387</text>
  <text x="555" y="141" font-size="9" fill="#334155" text-anchor="middle">IVC moderada,</text>
  <text x="555" y="153" font-size="9" fill="#334155" text-anchor="middle">pós-úlcera</text>

  <!-- Row 3 -->
  <rect x="10" y="164" width="600" height="48" rx="0" fill="#FFF7ED"/>
  <text x="80" y="185" font-size="13" font-weight="800" fill="#C2410C" text-anchor="middle">Classe 3</text>
  <text x="80" y="201" font-size="9" fill="#64748B" text-anchor="middle">Forte</text>
  <rect x="148" y="170" width="125" height="36" rx="6" fill="#FED7AA" stroke="#FB923C" stroke-width="1"/>
  <text x="210" y="188" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">25–35 mmHg</text>
  <text x="210" y="202" font-size="8.5" fill="#C2410C" text-anchor="middle">BSI 6612</text>
  <rect x="318" y="170" width="125" height="36" rx="6" fill="#FED7AA" stroke="#FB923C" stroke-width="1"/>
  <text x="380" y="188" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">34–46 mmHg</text>
  <text x="380" y="202" font-size="8.5" fill="#C2410C" text-anchor="middle">RAL-GZ 387</text>
  <text x="555" y="185" font-size="9" fill="#334155" text-anchor="middle">IVC grave,</text>
  <text x="555" y="197" font-size="9" fill="#334155" text-anchor="middle">úlcera ativa</text>
  <text x="555" y="209" font-size="8" fill="#C2410C" text-anchor="middle">⚠ requer Doppler</text>

  <!-- Row 4 -->
  <rect x="10" y="212" width="600" height="48" rx="0" fill="#FFFFFF"/>
  <text x="80" y="233" font-size="13" font-weight="800" fill="#7C3AED" text-anchor="middle">Classe 4</text>
  <text x="80" y="249" font-size="9" fill="#64748B" text-anchor="middle">Muito forte</text>
  <rect x="148" y="218" width="125" height="36" rx="6" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="210" y="233" font-size="11" fill="#6D28D9" text-anchor="middle">Não classificado</text>
  <text x="210" y="247" font-size="8.5" fill="#6D28D9" text-anchor="middle">no padrão britânico</text>
  <rect x="318" y="218" width="125" height="36" rx="6" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1"/>
  <text x="380" y="233" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">49–70 mmHg</text>
  <text x="380" y="247" font-size="8.5" fill="#7C3AED" text-anchor="middle">RAL-GZ 387</text>
  <text x="555" y="233" font-size="9" fill="#334155" text-anchor="middle">Linfedema grave,</text>
  <text x="555" y="245" font-size="9" fill="#334155" text-anchor="middle">pós-trombótico</text>

  <!-- Warning footer -->
  <rect x="10" y="268" width="600" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="310" y="284" font-size="10" fill="#92400E" text-anchor="middle" font-weight="600">⚠ "Classe 2" britânica (18–24 mmHg) ≠ "Classe 2" europeia (23–32 mmHg) — sempre verifique o padrão adotado pelo fabricante</text>
</svg>
