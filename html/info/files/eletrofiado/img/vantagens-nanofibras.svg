<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280">
  <rect width="700" height="280" fill="#FAFAF8" rx="12"/>
  <text x="350" y="28" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1A3A5C">Nanofibras Eletrofiadas vs. Curativos Convencionais</text>

  <!-- Headers -->
  <rect x="30" y="42" width="310" height="30" rx="6" fill="#E84855" opacity="0.15"/>
  <text x="185" y="62" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#B71C1C">⚠ Polímeros Sintéticos Convencionais</text>
  <rect x="360" y="42" width="310" height="30" rx="6" fill="#388E3C" opacity="0.15"/>
  <text x="515" y="62" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1B5E20">✓ Nanofibras PCL + Óleos Essenciais</text>

  <!-- Rows -->
  <!-- row 1 -->
  <rect x="30" y="78" width="310" height="32" rx="4" fill="#FFEBEE"/>
  <text x="185" y="97" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5A1A1A">❌ Baixa adesão celular</text>
  <rect x="360" y="78" width="310" height="32" rx="4" fill="#E8F5E9"/>
  <text x="515" y="97" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1A4A1A">✅ Alta biocompatibilidade (PCL biodegradável)</text>

  <!-- row 2 -->
  <rect x="30" y="116" width="310" height="32" rx="4" fill="#FFEBEE"/>
  <text x="185" y="135" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5A1A1A">❌ Efeito antibacteriano fraco</text>
  <rect x="360" y="116" width="310" height="32" rx="4" fill="#E8F5E9"/>
  <text x="515" y="135" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1A4A1A">✅ Atividade antimicrobiana comprovada</text>

  <!-- row 3 -->
  <rect x="30" y="154" width="310" height="32" rx="4" fill="#FFEBEE"/>
  <text x="185" y="173" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5A1A1A">❌ Resistência bacteriana a antibióticos</text>
  <rect x="360" y="154" width="310" height="32" rx="4" fill="#E8F5E9"/>
  <text x="515" y="173" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1A4A1A">✅ Alternativa natural — sem resistência cruzada</text>

  <!-- row 4 -->
  <rect x="30" y="192" width="310" height="32" rx="4" fill="#FFEBEE"/>
  <text x="185" y="211" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5A1A1A">❌ Superfície lisa — pouca área de contato</text>
  <rect x="360" y="192" width="310" height="32" rx="4" fill="#E8F5E9"/>
  <text x="515" y="211" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1A4A1A">✅ Alta porosidade + grande área superficial</text>

  <!-- row 5 -->
  <rect x="30" y="230" width="310" height="32" rx="4" fill="#FFEBEE"/>
  <text x="185" y="249" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5A1A1A">❌ Intolerância a antibióticos em pacientes</text>
  <rect x="360" y="230" width="310" height="32" rx="4" fill="#E8F5E9"/>
  <text x="515" y="249" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1A4A1A">✅ Óleos essenciais: menor risco de hipersensib.</text>

  <!-- VS badge -->
  <circle cx="344" cy="160" r="22" fill="#1A3A5C"/>
  <text x="344" y="165" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="white">VS</text>
