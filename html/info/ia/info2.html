<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Como Pensar IA</title>

<style>
body {
    font-family: Arial;
    background: #ffffff;
    margin: 0;
}

header {
    background: #2d6a4f;
    color: white;
    text-align: center;
    padding: 20px;
}

section {
    padding: 30px;
    max-width: 1000px;
    margin: auto;
}

.box {
    border-left: 5px solid #2d6a4f;
    padding: 15px;
    margin-bottom: 20px;
    background: #f1fdf6;
}

img {
    width: 100%;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
<h1>Como Pensar Inteligência Artificial</h1>
<p>Menos mágica. Mais processo.</p>
</header>

<section>

<div class="box">
<h2>Dados informam. Julgamento decide.</h2>
<p>A IA ajuda — mas quem decide é você.</p>
<img src="img/dados_vs_julgamento.png">
</div>

<div class="box">
<h2>Prompt não é mágica</h2>
<p>É escrever bem. Claro, estruturado e com contexto.</p>
<img src="img/prompt.png">
</div>

</section>

</body>
</html>
